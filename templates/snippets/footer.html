{% load static %}
{% load i18n %}
<style>
/* ── Pied de page compact (même esprit que celui d'eVazo) : une seule ligne,
   marque · contact · légal · copyright, séparés par des points médians. ── */
#pied {
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    padding: 14px 24px;
    text-align: center;
    font-family: var(--font-primary, 'Space Grotesk', sans-serif);
}
.vz-footer-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: .82rem;
    color: var(--text-subtle);
}
.vz-footer-brand {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text);
    font-weight: 600;
    letter-spacing: .02em;
    text-decoration: none !important;
}
.vz-footer-brand img {
    height: 20px; width: 20px;
    border-radius: 4px;
    object-fit: contain;
}
[data-theme="dark"] .vz-footer-brand img { filter: brightness(0) invert(1); }
.vz-footer-sep { color: var(--border); }
.vz-footer-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: .8rem;
    transition: color .2s;
}
.vz-footer-link .material-icons { font-size: .95rem; }
.vz-footer-link:hover { color: var(--accent); text-decoration: underline; }
.vz-footer-copy { color: var(--text-subtle); }

@media (max-width: 767px) {
    /* La barre de navigation mobile fixe ne doit pas recouvrir le pied de page */
    #pied { padding-bottom: calc(14px + 68px + env(safe-area-inset-bottom, 0px)); }
}
</style>

<footer id="pied" class="mt-5">
    <div class="vz-footer-inner">
        <a href="/" class="vz-footer-brand">
            <img src="{% static 'logo/vazimba_v2_icon.png' %}" alt="" onerror="this.style.display='none'"> Vazimba
        </a>
        <span class="vz-footer-sep">·</span>
        <a href="mailto:contact@vazimba.io" class="vz-footer-link">
            <span class="material-icons" aria-hidden="true">mail</span>contact@vazimba.io
        </a>
        <span class="vz-footer-sep">·</span>
        <a href="{% url 'legal:cgu' %}" class="vz-footer-link">
            <span class="material-icons" aria-hidden="true">description</span>CGU
        </a>
        <span class="vz-footer-sep">·</span>
        <a href="{% url 'legal:confidentialite' %}" class="vz-footer-link">
            <span class="material-icons" aria-hidden="true">shield</span>{% trans "Confidentialité" %}
        </a>
        <span class="vz-footer-sep">·</span>
        <a href="https://play.google.com/store/apps/details?id=com.vazimba.io" class="vz-footer-link" target="_blank" rel="noopener" title="{% trans 'Vazimba sur Google Play' %}">
            <span class="material-icons" aria-hidden="true">android</span>Google Play
        </a>
        <span class="vz-footer-sep">·</span>
        <span class="vz-footer-copy">© {% now "Y" %} Vazimba</span>
    </div>
</footer>
