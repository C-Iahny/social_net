{% extends 'base.html' %}
{% load static %}
{% load i18n %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/pages/base-password_reset_complete.css' %}">

<div class="auth-page">
    <div class="auth-card">

        <a href="{% url 'landing' %}" class="auth-brand">
            <img src="{% static 'logo/Vazi_logo003.jpeg' %}" alt="VAZIMBA" class="auth-brand-logo"
                 onerror="this.style.display='none'">
        </a>

        <div class="auth-icon-big">🎉</div>
        <h1 class="auth-heading">{% trans "Password updated!" %}</h1>
        <p class="auth-body">{% trans "Your password has been successfully reset. You can now sign in with your new password." %}</p>

        <a href="{% url 'login' %}" class="auth-btn">{% trans "Sign in" %}</a>
    </div>
</div>
{% endblock %}
