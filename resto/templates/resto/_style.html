{% load i18n %}
<style>
/* ============================================================
   RESTO VAZIMBA — styles partagés (client, vendeur, livreur)
   Repose sur les variables de base_css.html (--accent, --bg-card, --border…)
   ============================================================ */
.rs-wrap { max-width: 1100px; margin: 0 auto; padding: 1rem 1rem 5rem; }
.rs-hero {
    background: linear-gradient(135deg, #5c2a08 0%, #A0522D 100%);
    color: #fff; padding: 2.4rem 1.2rem 2rem; text-align: center; position: relative; overflow: hidden;
}
[data-theme="dark"] .rs-hero { background: linear-gradient(135deg, #1a0a02 0%, #3d1a06 100%); }
.rs-hero h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -.03em; margin: 0 0 .3rem; }
.rs-hero p  { opacity: .85; font-size: .92rem; margin: 0 0 1.1rem; }
.rs-search { display: flex; max-width: 560px; margin: 0 auto .8rem; background: rgba(0,0,0,.35);
             border: 1.5px solid rgba(255,255,255,.25); border-radius: 50px; padding: .3rem .3rem .3rem 1.1rem; }
.rs-search input { flex: 1; background: transparent !important; border: none !important; box-shadow: none !important;
                   color: #fff !important; font-size: .95rem; outline: none; }
.rs-search input::placeholder { color: rgba(255,255,255,.6); }
.rs-search button { background: #fff; color: #8B4513; border: none; border-radius: 40px; padding: .5rem 1.2rem;
                    font-weight: 700; font-size: .88rem; cursor: pointer; }
[data-theme="dark"] .rs-search button { background: var(--accent); color: #1a0a02; }
.rs-hero-links { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; }
.rs-hero-links a { color: #fff; font-size: .82rem; font-weight: 600; text-decoration: none;
                   border: 1px solid rgba(255,255,255,.4); border-radius: 30px; padding: .3rem .9rem; }
.rs-hero-links a:hover { background: rgba(255,255,255,.15); color: #fff; text-decoration: none; }

/* Filtres */
.rs-filters { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: .7rem 1rem;
              position: sticky; top: 58px; z-index: 90; }
.rs-filters form { max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.rs-select { background: var(--input-bg, var(--bg-card)); border: 1.5px solid var(--border); border-radius: 8px;
             padding: .42rem .85rem; font-size: .85rem; color: var(--text); min-width: 140px; }
.rs-chip { display: inline-flex; align-items: center; gap: .3rem; border: 1.5px solid var(--border); border-radius: 30px;
           padding: .3rem .8rem; font-size: .8rem; color: var(--text-muted); text-decoration: none; white-space: nowrap; }
.rs-chip.active, .rs-chip:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

/* Cartes & boutons */
.rs-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--main-radius, 12px);
           box-shadow: var(--shadow); overflow: hidden; }
.rs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
.rs-btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: none; cursor: pointer;
          border-radius: 10px; padding: .6rem 1.1rem; font-weight: 700; font-size: .9rem; text-decoration: none;
          background: var(--accent); color: #fff; transition: transform .15s, box-shadow .15s; }
.rs-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px var(--accent-glow); color: #fff; text-decoration: none; }
.rs-btn.secondary { background: var(--btn-bg); color: var(--text); }
.rs-btn.danger { background: #c0392b; }
.rs-btn.ghost { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.rs-btn.sm { padding: .35rem .7rem; font-size: .8rem; border-radius: 8px; }
.rs-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.rs-muted { color: var(--text-muted); font-size: .85rem; }
.rs-badge { display: inline-block; font-size: .68rem; font-weight: 700; padding: .15rem .5rem; border-radius: 20px; }
.rs-badge.open   { background: #d1fae5; color: #065f46; }
.rs-badge.closed { background: #fee2e2; color: #991b1b; }
.rs-badge.status { background: var(--btn-bg); color: var(--text); }
.rs-badge.pending { background: #fef3c7; color: #92400e; }
.rs-badge.ok     { background: #d1fae5; color: #065f46; }
.rs-badge.ko     { background: #fee2e2; color: #991b1b; }
.rs-price { font-weight: 800; color: var(--accent); }
.rs-rating { font-weight: 700; color: #d97706; font-size: .85rem; white-space: nowrap; }
.rs-stars { display: inline-flex; flex-direction: row-reverse; gap: .15rem; }
.rs-stars input { display: none; }
.rs-stars label { font-size: 1.7rem; color: var(--border); cursor: pointer; line-height: 1; }
.rs-stars input:checked ~ label, .rs-stars label:hover, .rs-stars label:hover ~ label { color: #f59e0b; }
.rs-review { padding: .6rem 0; border-top: 1px dashed var(--border); font-size: .88rem; }
.rs-review .who { font-weight: 700; }
.rs-section-title { font-weight: 800; font-size: 1.15rem; margin: 1.4rem 0 .6rem; color: var(--text); }
.rs-empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
.rs-empty .ico { font-size: 3rem; }
.rs-tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin: .8rem 0; }
.rs-tabs a { border-radius: 30px; padding: .35rem .9rem; font-size: .85rem; font-weight: 600; text-decoration: none;
             background: var(--btn-bg); color: var(--text); }
.rs-tabs a.active { background: var(--accent); color: #fff; }
.rs-form label { font-weight: 600; font-size: .85rem; color: var(--text); margin-bottom: .2rem; }
.rs-form .form-control { background: var(--input-bg, var(--bg-card)); color: var(--text); border: 1.5px solid var(--border); border-radius: 8px; }
.rs-form .help { font-size: .75rem; color: var(--text-muted); }
.rs-form .err { color: #c0392b; font-size: .8rem; }
.rs-row { display: flex; gap: .8rem; flex-wrap: wrap; }
.rs-row > * { flex: 1 1 200px; }

/* Panier flottant (bas de page) */
.rs-cartbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 1001;
              background: var(--accent); color: #fff; border-radius: 40px; padding: .7rem 1.2rem;
              display: none; align-items: center; gap: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,.3);
              text-decoration: none; font-weight: 700; max-width: 92vw; }
.rs-cartbar:hover { color: #fff; text-decoration: none; }
.rs-cartbar.show { display: inline-flex; }
@media (min-width: 992px) { .rs-cartbar { bottom: 24px; } }

/* Fenêtre modale (options de plat) */
/* z-index 10050 : au-dessus de l'en-tête et de la barre de navigation mobile (1000),
   sous les toasts Django (99999). Sur mobile la barre du bas masquait le bouton « Ajouter ». */
.rs-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 10050; display: none;
               align-items: flex-end; justify-content: center; }
.rs-modal-bg.show { display: flex; }
.rs-modal { background: var(--bg-card); color: var(--text); width: 100%; max-width: 520px; max-height: 92vh;
            overflow-y: auto; border-radius: 18px 18px 0 0;
            padding: 1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 768px) { .rs-modal-bg { align-items: center; } .rs-modal { border-radius: 18px; } }
.rs-modal h3 { font-weight: 800; font-size: 1.15rem; margin: 0; }
.rs-opt-group { margin-top: .9rem; border-top: 1px solid var(--border); padding-top: .7rem; }
.rs-opt-group h4 { font-size: .9rem; font-weight: 700; margin: 0 0 .3rem; display: flex; justify-content: space-between; }
.rs-opt { display: flex; align-items: center; gap: .6rem; padding: .4rem 0; cursor: pointer; font-size: .9rem; }
.rs-opt input { width: 18px; height: 18px; accent-color: var(--accent); }
.rs-opt .extra { margin-left: auto; color: var(--text-muted); font-size: .82rem; }
.rs-qty { display: inline-flex; align-items: center; border: 1.5px solid var(--border); border-radius: 30px; overflow: hidden; }
.rs-qty button { background: transparent; border: none; width: 34px; height: 34px; font-size: 1.1rem; color: var(--text); cursor: pointer; }
.rs-qty span { min-width: 28px; text-align: center; font-weight: 700; }

/* Suivi de commande */
.rs-steps { display: flex; gap: 0; margin: .8rem 0 1rem; overflow-x: auto; }
.rs-step { flex: 1; min-width: 70px; text-align: center; position: relative; font-size: .68rem; color: var(--text-muted); }
.rs-step .dot { width: 22px; height: 22px; border-radius: 50%; margin: 0 auto .3rem; background: var(--border);
                display: flex; align-items: center; justify-content: center; color: #fff; font-size: .8rem; }
.rs-step.done .dot { background: #10b981; }
.rs-step.current .dot { background: var(--accent); box-shadow: 0 0 0 5px var(--accent-glow); }
.rs-step.current { color: var(--accent); font-weight: 700; }
.rs-step::after { content: ''; position: absolute; top: 11px; left: 50%; width: 100%; height: 2px; background: var(--border); z-index: -1; }
.rs-step:last-child::after { display: none; }
.rs-step.done::after { background: #10b981; }
#rs-map { width: 100%; height: 320px; border-radius: 12px; border: 1px solid var(--border); background: var(--btn-bg); }
.rs-timeline { list-style: none; padding: 0; margin: 0; }
.rs-timeline li { padding: .35rem 0 .35rem 1.2rem; border-left: 2px solid var(--border); position: relative; font-size: .85rem; }
.rs-timeline li::before { content: ''; position: absolute; left: -6px; top: .65rem; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.rs-order-line { display: flex; justify-content: space-between; gap: .6rem; padding: .45rem 0; border-bottom: 1px dashed var(--border); font-size: .9rem; }
.rs-order-line small { display: block; color: var(--text-muted); font-size: .78rem; }
</style>
