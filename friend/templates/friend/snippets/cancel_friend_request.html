{% load i18n %}


<script type="text/javascript">
	
	function cancelFriendRequest(id, uiUpdateFunction){
		payload = {
			"csrfmiddlewaretoken": "{{ csrf_token }}",
			"receiver_user_id": id,
		}
		$.ajax({
			type: 'POST',
			dataType: "json",
			url: "{% url 'friend:friend-request-cancel' %}",
			data: payload,
			timeout: 5000,
			success: function(data) {
				console.log("SUCCESS", data)
				if(data['response'] == "Friend request canceled."){
					vzToast('{% trans "Demande annulée"|escapejs %}', 'success')
				}
				else if(data['response'] != null){
					vzAlert(data['response'])
				}
			},
			error: function(data) {
				console.error("ERROR...", data)
				vzAlert("{% trans 'Une erreur est survenue'|escapejs %}")
			},
			complete: function(data){
				uiUpdateFunction()
			}
		});
	}
	

</script>
