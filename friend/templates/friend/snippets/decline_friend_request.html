<script type="text/javascript">

	// POST + jeton CSRF : la vue n'accepte plus le GET (une requête GET
	// n'est pas protégée contre le CSRF — voir friend/views.py).
	function declineFriendRequest(friend_request_id, uiUpdateFunction){
		var url = "{% url 'friend:friend-request-decline' friend_request_id=53252623623632623 %}".replace("53252623623632623", friend_request_id)
		$.ajax({
			type: 'POST',
			dataType: "json",
			url: url,
			data: { csrfmiddlewaretoken: "{{ csrf_token }}" },
			timeout: 5000,
			success: function(data) {
				if(data['response'] == "Friend request declined."){
					// ui is updated
				}
				else if(data['response'] != null){
					alert(data['response'])
				}
			},
			error: function(xhr) {
				console.error("ERROR...", xhr)
				var msg = "Something went wrong."
				try { msg = JSON.parse(xhr.responseText)['response'] || msg } catch(e) {}
				alert(msg)
			},
			complete: function(data){
				uiUpdateFunction()
			}
		});
	}

</script>
